[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdl-engine"
version = "0.2.0"
description = "Materials Discovery Lab implication engine: deterministic physics layer and record-frontier temporal analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["mdl_engine*"]

[tool.setuptools.package-data]
mdl_engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
