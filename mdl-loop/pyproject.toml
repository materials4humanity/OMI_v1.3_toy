[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdl-loop"
version = "0.5.0"
description = "MDL C1 loop: run schema, P0 trajectory space, virtual-kesterite test surface, noise-aware batch BO vs OVAT, and the C1 power analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["mdl_loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::Warning"]
